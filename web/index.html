<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TROPA v2 - Community & Cooperative Management System">
  <meta name="theme-color" content="#004FB0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TROPA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TROPA v2</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Shown the moment the page opens, until Flutter draws its first frame. Matches the app's
       startup screen (brand-blue backdrop, white card). */
    html, body { margin: 0; height: 100%; background: #1F4DAA; }
    #tropa-splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #1F4DAA; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity .2s ease;
    }
    #tropa-splash .card {
      width: 296px; max-width: calc(100vw - 48px); padding: 32px; box-sizing: border-box; border-radius: 20px;
      background: #fff; box-shadow: 0 8px 24px rgba(0, 0, 0, .12); text-align: center;
    }
    #tropa-splash .mark { font-weight: 800; font-size: 30px; letter-spacing: .04em; color: #1F4DAA; }
    #tropa-splash .tag { margin-top: 4px; font-size: 12px; color: rgba(0, 0, 0, .55); }
    #tropa-splash .bar { position: relative; overflow: hidden; width: 160px; height: 3px; margin: 28px auto 12px; border-radius: 2px; background: rgba(31, 77, 170, .15); }
    #tropa-splash .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: #1F4DAA; animation: tropa-slide 1.1s ease-in-out infinite; }
    #tropa-splash .msg { font-size: 13px; color: rgba(0, 0, 0, .55); }
    @keyframes tropa-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #tropa-splash .bar::after { animation: none; width: 100%; opacity: .5; } }
  </style>
</head>
<body>
  <div id="tropa-splash" role="status" aria-live="polite">
    <div class="card">
      <div class="mark">TROPA</div>
      <div class="tag">Tabang Respeto Og Panalipud</div>
      <div class="bar"></div>
      <div class="msg">Loading…</div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function () {
      var started = false;
      // Offline support: sw.js is generated by scripts/gen_sw.mjs after `flutter build web`.
      // Registered only after the app has drawn, so caching files for offline use never competes
      // with the first load for bandwidth.
      function registerServiceWorker() {
        if (started || !('serviceWorker' in navigator)) return;
        started = true;
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('Service worker failed:', e); });
      }
      window.addEventListener('flutter-first-frame', function () {
        var splash = document.getElementById('tropa-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(function () { splash.remove(); }, 250);
        }
        setTimeout(registerServiceWorker, 3000);
      });
      // Fallback in case the first-frame event never arrives.
      window.addEventListener('load', function () { setTimeout(registerServiceWorker, 30000); });
    })();
  </script>
</body>
</html>
