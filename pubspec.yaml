name: tropa_v2
description: "TROPA v2 (Tabang Respeto Og Panalipud) - Community & Cooperative Management System"
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Routing & RBAC Navigation
  go_router: ^14.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Backend & Storage
  supabase_flutter: ^2.8.0

  # Environment configuration
  flutter_dotenv: ^5.2.1

  # Interactive Map
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Forms & Validation
  flutter_form_builder: ^9.4.0
  form_builder_validators: ^10.0.1

  # Data Tables
  data_table_2: ^2.5.15

  # Utilities
  intl: any
  uuid: ^4.5.1
  file_picker: ^8.1.2
  csv: ^6.0.0
  pdf: ^3.11.1
  image: ^4.1.2
  printing: ^5.13.2
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  powersync: ^1.18.0
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.7
  archive: ^4.0.0
  http: ^1.6.0
  web: ^1.1.1
  sqlite_async: ^0.13.1
  package_info_plus: ^9.0.1

dependency_overrides:
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/tropa_id/
    - assets/fonts/
